<html>
<body>
<style>
    button {
        left: 100px;
        top: 50px;
        height: 20px;
        width: 150px;
        position: relative;
    }

    button::after {
     content: attr(tool-tip);

     opacity: 0;
     visibility: hidden;
    }

    button:hover::after {
        position: absolute;
        left: 0;
        top: 100%;
        background-color: #333;
        color: #fff;
        padding: 5px;
        border-radius: 3px;
        white-space: nowrap;
        opacity: 1;
        transition: opacity 0.3s;
        visibility: visible;
    }
</style>

<button tool-tip="This is a tooltip">Hover over me</button>
</body>
</html>
